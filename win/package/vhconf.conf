docRoot $VH_ROOT/html/
enableGzip 1

context / {
  allowBrowse 1
  location $DOC_ROOT/
}

index {
  indexFiles index.html, index.php
  autoIndex 0
  useServer 0
}

errorPage 404 {
  url /error404.html
}

errorlog $VH_ROOT/logs/error.log {
  useServer 1
}

accessLog $VH_ROOT/logs/access.log {
  useServer 0
  logReferer 1
  logUserAgent 1
}

rewrite {
  enable 1
  autoLoadHtaccess 1
}
