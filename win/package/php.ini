[PHP]
engine = On
short_open_tag = On
memory_limit = 128M
max_execution_time = 60
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED
display_errors = Off
log_errors = On
error_log = "%ROOT%/admin/logs/php_error.log"
variables_order = "GPCS"
post_max_size = 32M
upload_max_filesize = 32M
extension_dir = "%PHP_EXT%"
extension = sockets
extension = mbstring
extension = openssl
session.save_handler = files
session.save_path = "%ROOT%/admin/tmp"
session.use_strict_mode = 1
session.cookie_httponly = 1
date.timezone = UTC
