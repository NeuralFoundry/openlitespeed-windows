<svg xmlns="http://www.w3.org/2000/svg" width="880" height="709" viewBox="0 0 880 709" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><title id="t">OpenLiteSpeed for Windows vs nginx and Apache</title><desc id="d">Bar charts of requests per second for the native Windows build of OpenLiteSpeed, nginx and Apache on Windows.</desc><rect x="0.5" y="0.5" width="879" height="708" rx="8" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="34" font-size="17" font-weight="600" fill="#1f2328">OpenLiteSpeed for Windows vs nginx and Apache</text><text x="24" y="56" font-size="12.5" fill="#59636e">Native Windows build of OpenLiteSpeed 1.9.4. Requests per second on Windows 11, higher is better.</text><text x="24" y="75" font-size="12.5" fill="#59636e">PHP 8.4, 20 second runs, 128 keep-alive connections (64 for WordPress), same 12 CPU cores for every server</text><text x="24" y="111" font-size="14" font-weight="600" fill="#1f2328">Static file, 8 KB HTML</text><line x1="220.0" y1="127" x2="220.0" y2="217" stroke="#eaeef2" stroke-width="1"/><text x="220.0" y="233" font-size="11" fill="#6e7781" text-anchor="middle">0</text><line x1="361.0" y1="127" x2="361.0" y2="217" stroke="#eaeef2" stroke-width="1"/><text x="361.0" y="233" font-size="11" fill="#6e7781" text-anchor="middle">50K</text><line x1="502.0" y1="127" x2="502.0" y2="217" stroke="#eaeef2" stroke-width="1"/><text x="502.0" y="233" font-size="11" fill="#6e7781" text-anchor="middle">100K</text><line x1="643.0" y1="127" x2="643.0" y2="217" stroke="#eaeef2" stroke-width="1"/><text x="643.0" y="233" font-size="11" fill="#6e7781" text-anchor="middle">150K</text><line x1="784.0" y1="127" x2="784.0" y2="217" stroke="#eaeef2" stroke-width="1"/><text x="784.0" y="233" font-size="11" fill="#6e7781" text-anchor="middle">200K</text><line x1="220" y1="127" x2="220" y2="217" stroke="#d0d7de" stroke-width="1"/><text x="208" y="146.5" font-size="13" fill="#1f2328"